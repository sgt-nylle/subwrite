<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#ff2222" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background circular sonar badge -->
  <circle cx="32" cy="32" r="30" fill="#0d0101" stroke="#ff2222" stroke-width="2"/>
  
  <!-- Subtle radar sweep lines -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#440000" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#440000" stroke-width="1"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#440000" stroke-width="1" opacity="0.5"/>
  <line x1="2" y1="32" x2="62" y2="32" stroke="#440000" stroke-width="1" opacity="0.5"/>

  <!-- Red Submarine Silhouette (Gotland / Red October hybrid) -->
  <g filter="url(#glow)">
    <!-- Periscope / Mast -->
    <rect x="34" y="16" width="2" height="7" fill="#ffffff"/>
    <circle cx="35" cy="15" r="1.5" fill="#ffd700"/>
    
    <!-- Conning Tower (Sail) -->
    <path d="M 30 23 L 32 19 L 38 19 L 40 23 Z" fill="#ff4444" stroke="#ff8888" stroke-width="0.8"/>
    
    <!-- Stern X-Rudders -->
    <line x1="12" y1="24" x2="16" y2="32" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="40" x2="16" y2="32" stroke="#ff3333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Propeller -->
    <line x1="10" y1="28" x2="10" y2="36" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Main Hull -->
    <path d="M 52 32 C 52 27, 46 25, 36 25 L 20 25 C 16 25, 14 28, 14 32 C 14 36, 16 39, 20 39 L 36 39 C 46 39, 52 37, 52 32 Z" 
          fill="#ff2222" stroke="#ff7777" stroke-width="1.2"/>

    <!-- Waterline slit -->
    <line x1="20" y1="32" x2="48" y2="32" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 2" opacity="0.9"/>
    
    <!-- Bow Torpedo Tube -->
    <circle cx="50" cy="32" r="1.5" fill="#550000"/>
  </g>
</svg>
